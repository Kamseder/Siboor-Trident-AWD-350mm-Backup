#LED´s Configurations

#####################################################################
#  Chamber LED´s
#####################################################################
[neopixel Chamber_LEDs]
pin: PD15                                                            # Signal interface
chain_count: 50                                                      # Number of LEDs
color_order: GRB                                                     # Color order
initial_RED: 0.0                                                     # Initial red brightness
initial_GREEN: 0.0                                                   # Initial green brightness
initial_BLUE: 0.0                                                    # Initial blue brightness

[delayed_gcode CHAMBER_LIGHT_STARTUP]
initial_duration: 1.5
gcode:
    CHAMBER_LIGHT_IGNITION


[gcode_macro CHAMBER_LIGHT_IGNITION]
gcode:
    {% set attempts = range(5, 9) | random %}

    {% for i in range(attempts) %}
        {% set level = range(35, 95) | random / 100.0 %}
        {% set ontime = range(10, 35) | random * 10 %}
        {% set offtime = range(15, 60) | random * 10 %}

        SET_LED LED=Chamber_LEDs RED={level * 0.8} GREEN={level * 0.8} BLUE={level} SYNC=0
        G4 P{ontime|int}

        SET_LED LED=Chamber_LEDs RED=0 GREEN=0 BLUE=0 SYNC=0
        G4 P{offtime|int}
    {% endfor %}

    # letzter längerer Fehlstart
    SET_LED LED=Chamber_LEDs RED=0.45 GREEN=0.45 BLUE=0.55 SYNC=0
    G4 P250
    SET_LED LED=Chamber_LEDs RED=0 GREEN=0 BLUE=0 SYNC=0
    G4 P450

    # kurzes Flattern vorm Zünden
    SET_LED LED=Chamber_LEDs RED=0.7 GREEN=0.7 BLUE=0.9 SYNC=0
    G4 P120
    SET_LED LED=Chamber_LEDs RED=0 GREEN=0 BLUE=0 SYNC=0
    G4 P90
    SET_LED LED=Chamber_LEDs RED=0.8 GREEN=0.8 BLUE=1 SYNC=0
    G4 P180
    SET_LED LED=Chamber_LEDs RED=0 GREEN=0 BLUE=0 SYNC=0
    G4 P160

    # gezündet
    SET_LED LED=Chamber_LEDs RED=0.8 GREEN=0.8 BLUE=1 SYNC=0