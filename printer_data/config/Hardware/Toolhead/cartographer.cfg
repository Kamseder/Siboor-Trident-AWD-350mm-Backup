#Cartographer Configurations

#####################################################################
#  Cartographer V3 （ADXL345）
#####################################################################
[mcu cartographer]
canbus_uuid: ab80958e982c                                            # Fill in the UUID that was just recorded

[cartographer]
mcu: cartographer
x_offset: 0 # This is the offset of your probe from the nozzle tip, to the centre of the coil.
y_offset: 24.6 # This is the offset of your probe from the nozzle tip, to the centre of the coil.
verbose: yes # For extra output


#####################################################################
#  Redefine the Z-motion endstop_pin!
#####################################################################
[stepper_z]
endstop_pin: probe:z_virtual_endstop	                             # Uses cartographer virtual endstop
homing_retract_dist: 0


[safe_z_home]
home_xy_position:
  175, 175   #A X, Y coordinate (e.g. 100, 100) where the Z homing should be
#   performed. This parameter must be provided.
#speed: 50.0
#   Speed at which the toolhead is moved to the safe Z home
#   coordinate. The default is 50 mm/s
#z_hop:
#   Distance (in mm) to lift the Z axis prior to homing. This is
#   applied to any homing command, even if it doesn't home the Z axis.
#   If the Z axis is already homed and the current Z position is less
#   than z_hop, then this will lift the head to a height of z_hop. If
#   the Z axis is not already homed the head is lifted by z_hop.
#   The default is to not implement Z hop.
#z_hop_speed: 15.0
#   Speed (in mm/s) at which the Z axis is lifted prior to homing. The
#   default is 15 mm/s.
#move_to_previous: False
#   When set to True, the X and Y axes are reset to their previous
#   positions after Z axis homing. The default is False.


#####################################################################
#  Temperature Monitoring
#####################################################################
[temperature_sensor Cartographer_MCU]                                # Cartographer_MCU Temperature sensor configuration
sensor_type: temperature_mcu                                         # Sensor type
sensor_mcu: cartographer                                             # Sensor pin
min_temp: 0                                                          # Minimum temperature
max_temp: 105                                                        # Maximum temperature


#####################################################################
#  Cartographer adxl345
#####################################################################
[adxl345 carto]                                                      # Adxl from Carto
cs_pin: cartographer:PA3                                             # Chip select pin for ADXL345 accelerometer
spi_bus: spi1                                                        # SPI bus used for communication


#####################################################################
#  Macros
#####################################################################
